[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aistudio-api"
version = "0.1.0"
description = "Gemini-compatible API wrapper for Google AI Studio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "curl_cffi>=0.7.0",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "uvicorn>=0.30.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0.0",
  "websockets>=13.0.0",
  "python-multipart>=0.0.9",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pydantic-core==2.41.5; sys_platform == 'android'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pyright>=1.1.300"
]
test = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0"
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportPrivateUsage = false
reportUnusedVariable = "warning"
reportUnusedImport = "warning"

[project.scripts]
aistudio-api = "aistudio_api.main:main"
aistudio-api-server = "aistudio_api.api.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
[[tool.uv.index]]
name = "tur"
url = "https://termux-user-repository.github.io/pypi/"
explicit = true

[tool.uv.sources]
pydantic-core = [
  { index = "tur", marker = "sys_platform == 'android'" },
]
