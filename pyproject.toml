[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aistudio-api"
version = "0.1.0"
description = "Gemini-compatible API wrapper for Google AI Studio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "curl_cffi>=0.7.0",
  "httpx>=0.28.0",
  "pydantic==2.12.5",
  "uvicorn>=0.30.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0.0",
  "websockets>=14.0.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "google-genai>=1.0.0",
  "pyright>=1.1.300",
  "ruff>=0.8.0; sys_platform != 'android'",
]
test = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "google-genai>=1.0.0",
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportPrivateUsage = false
reportUnusedVariable = "warning"
reportUnusedImport = "warning"

[project.scripts]
aistudio-api = "aistudio_api.main:main"
aistudio-api-server = "aistudio_api.api.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".git",
    ".venv",
    "web",
    "android",
    "data",
    "data2",
    "botguard-fork",
    "build",
    "dist",
]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:anyio"
filterwarnings = [
    "error",
    "ignore:.*_UnionGenericAlias.*:DeprecationWarning:google\\.genai\\.types",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
exclude = [
    ".git",
    ".venv",
    "web",
    "src/aistudio_api/static",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
    "ASYNC",  # flake8-async
    "PIE",    # flake8-pie
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "T10",    # flake8-debugger
    "A",      # flake8-builtins
    "YTT",    # flake8-2020
]
ignore = [
    "E501",      # Line too long (handled by formatter)
    "B008",      # Do not perform function call `Depends` in argument defaults (FastAPI standard pattern)
    "RUF001",    # Ambiguous unicode characters in strings (Chinese fullwidth punctuation)
    "RUF002",    # Ambiguous unicode characters in docstrings (Chinese fullwidth punctuation)
    "RUF003",    # Ambiguous unicode characters in comments (Chinese fullwidth punctuation)
    "ASYNC109",  # Async function definition with a `timeout` parameter
    "ASYNC230",  # Async functions opening files with blocking methods
    "ASYNC240",  # Async functions performing blocking pathlib operations
]

[tool.ruff.lint.isort]
known-first-party = ["aistudio_api"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"src/aistudio_api/infrastructure/account/account_store.py" = ["PTH"]
"tests/**" = ["B018", "PTH", "ASYNC", "A001", "A002", "RET504", "TC001", "TC002", "TC003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
